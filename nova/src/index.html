<!DOCTYPE HTML>
<html>
<head>
  <title>Nova</title>
  <!-- GitHub Pages serves index.html with max-age=600; without this the
       entry page can pin an old bundle/game-data version for up to 10 min
       after a deploy (the ?v= query busts those only once the new HTML is
       fetched). Ask browsers to revalidate this page every load. -->
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <style type="text/css">
	html {
		overflow:hidden;
	}
	body {
		margin: 0;
		padding: 0;
		background-color: #000000;
	}
	/* Full-screen "Loading..." overlay, shown until browser.ts hides it
	   (once the game loop is running). Pure CSS so it paints before any
	   JavaScript fetches or decodes the game data. */
	#loading {
		position: fixed;
		top: 0;
		right: 0;
		bottom: 0;
		left: 0;
		background-color: #000000;
		color: #ffffff;
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 1000;
		font-family: sans-serif;
		font-size: 24px;
	}
	#loading .spinner {
		width: 32px;
		height: 32px;
		margin-right: 16px;
		border: 4px solid #444444;
		border-top-color: #ffffff;
		border-radius: 50%;
		animation: loading-spin 1s linear infinite;
	}
	@keyframes loading-spin {
		to { transform: rotate(360deg); }
	}
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><span>Loading...</span></div>
  <script type="application/javascript" src="browser_bundle.js"></script>
</body>
</html>
